[project]
name = "offline-docker-cli"
version = "2.2.0"
description = "Universal Docker offline cache, build and Trivy scan CLI for NeuroAI projects"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "D.Shapovalov", email = "d.shapovalov@vitebsk.energo.net" }]
keywords = ["docker", "offline", "trivy", "neuroai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: System :: Software Distribution",
]

dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
tui = ["textual>=0.80"]
dev = ["pyyaml>=6.0", "textual>=0.80"]

[project.scripts]
offdock = "offline_docker.cli:main"

[project.urls]
Homepage = "https://gitlab.vitebsk.energo.net/neuroai/offline-docker-cli"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
offline_docker = []
