[project]
name = "offdock"
version = "2.2.3"
description = "Universal Docker offline cache, build and Trivy scan CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "D.Shapovalov", email = "d.shapovalov@vitebsk.energo.net" }]
keywords = ["docker", "offline", "trivy", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
tui = ["textual>=0.80"]
dev = ["pyyaml>=6.0", "textual>=0.80", "pytest>=8"]

[project.scripts]
offdock = "offline_docker.cli:main"

[project.urls]
Homepage = "https://github.com/DzmitrySha/offline-docker-cli"
Repository = "https://github.com/DzmitrySha/offline-docker-cli"
Issues = "https://github.com/DzmitrySha/offline-docker-cli/issues"
Changelog = "https://github.com/DzmitrySha/offline-docker-cli/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
offline_docker = []
