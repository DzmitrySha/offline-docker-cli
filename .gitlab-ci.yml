# Раннер — shell-executor: `image:` игнорируется, системный python 3.6 (RHEL 8),
# pip/uv не установлены. Тесты на stdlib unittest и зависимостей не требуют —
# нужен только интерпретатор >= 3.11; если его нет, uv скачивает standalone
# CPython в $HOME (без root).
#
# GIT_STRATEGY: clone + GIT_DEPTH: 0 — раннер переиспользует каталог сборки,
# shallow-fetch в него падал на "git fetch-pack: expected shallow list".
stages: [test]

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0

test:
  stage: test
  script:
    - |
      set -e
      PY=$(command -v python3.13 || command -v python3.12 || command -v python3.11 || true)
      if [ -z "$PY" ] && command -v python3 >/dev/null 2>&1 \
         && python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
        PY=$(command -v python3)
      fi
      if [ -z "$PY" ]; then
        echo ">>> системный python < 3.11: ставлю uv и standalone CPython 3.12"
        command -v uv >/dev/null 2>&1 || curl -fsSL https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        uv python install 3.12
        PY=$(uv python find 3.12)
      fi
      echo ">>> python: $($PY -V 2>&1) [$PY]"
      PYTHONPATH=src "$PY" -m unittest discover -s tests -t . -q
      PYTHONPATH=src "$PY" -m offline_docker --version
      PYTHONPATH=src "$PY" -m offline_docker --help > /dev/null
