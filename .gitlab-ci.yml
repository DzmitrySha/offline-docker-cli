# Раннер — shell-executor: `image:` игнорируется, pip/uv в системе нет.
# Тесты на stdlib unittest и не требуют зависимостей (pyyaml/textual опциональны).
stages: [test]

test:
  stage: test
  script:
    - PY=$(command -v python3.12 || command -v python3.11 || command -v python3)
    - 'echo "python: $($PY -V 2>&1)"'
    - PYTHONPATH=src "$PY" -m unittest discover -s tests -t . -q
    - PYTHONPATH=src "$PY" -m offline_docker --version
    - PYTHONPATH=src "$PY" -m offline_docker --help > /dev/null
